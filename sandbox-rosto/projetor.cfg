# Abre a janela do SARndbox já em tela cheia no projetor (HDMI-0, à direita do monitor).
# Usado por sandbox.sh com "-mergeConfig"; não altera o Vrui.cfg do sistema.
section Vrui
	section Desktop
		section Window
			outputName HDMI-0
			windowPos (1280, 0), (1024, 768)
			windowFullscreen true
		endsection
	endsection
endsection
