<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Visão</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login">
<form method="post" class="card login-card">
  <div class="brand big"><span class="dot"></span>Visão</div>
  <p class="muted">Presença do laboratório</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  <label>Usuário<input name="usuario" autofocus required autocomplete="username" autocapitalize="none"></label>
  <label>Senha<input type="password" name="senha" required autocomplete="current-password"></label>
  <button class="btn" type="submit">Entrar</button>
</form>
</body>
</html>
